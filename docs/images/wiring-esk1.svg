<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#111827">CC1101 to Apollo Starter Kit Breakout</text>
  <text x="40" y="72" font-size="15" fill="#4b5563">Seven wires. Match the colored dots on both headers, or follow the list at the bottom.</text>

  <!-- ============ RADIO MODULE ============ -->
  <g>
    <text x="40" y="120" font-size="17" font-weight="600" fill="#111827">CC1101 module, 2x4 header</text>
    <text x="40" y="142" font-size="13" fill="#6b7280">Component side up, antenna at the top</text>

    <!-- antenna marker -->
    <rect x="40" y="158" width="360" height="26" rx="6" fill="#e5e7eb"/>
    <text x="220" y="176" font-size="13" fill="#374151" text-anchor="middle">antenna end</text>

    <!-- header body -->
    <rect x="40" y="196" width="360" height="164" rx="10" fill="#1f2937"/>

    <!-- column labels -->
    <text x="115" y="382" font-size="12" fill="#6b7280" text-anchor="middle">board edge row</text>
    <text x="285" y="382" font-size="12" fill="#6b7280" text-anchor="middle">chip side row</text>

    <!-- pins: 4 rows of pairs, power pair at the bottom -->
    <!-- pair 4: MISO / GDO2 -->
    <circle cx="115" cy="228" r="13" fill="#2563eb" stroke="#111827" stroke-width="2"/>
    <text x="138" y="233" font-size="13" fill="#e5e7eb">7 MISO</text>
    <circle cx="285" cy="228" r="13" fill="#9ca3af" stroke="#111827" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="306" y="233" font-size="13" fill="#9ca3af">8 unused</text>

    <!-- pair 3: SCK / MOSI -->
    <circle cx="115" cy="266" r="13" fill="#16a34a" stroke="#111827" stroke-width="2"/>
    <text x="138" y="271" font-size="13" fill="#e5e7eb">5 SCK</text>
    <circle cx="285" cy="266" r="13" fill="#9ca3af" stroke="#111827" stroke-width="2"/>
    <text x="306" y="271" font-size="13" fill="#e5e7eb">6 MOSI</text>

    <!-- pair 2: GDO0 / CSN -->
    <circle cx="115" cy="304" r="13" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
    <text x="138" y="309" font-size="13" fill="#e5e7eb">3 GDO0</text>
    <circle cx="285" cy="304" r="13" fill="#f97316" stroke="#111827" stroke-width="2"/>
    <text x="306" y="309" font-size="13" fill="#e5e7eb">4 CSN</text>

    <!-- pair 1: GND / VCC -->
    <circle cx="115" cy="342" r="13" fill="#111827" stroke="#f9fafb" stroke-width="2"/>
    <text x="138" y="347" font-size="13" fill="#e5e7eb">1 GND</text>
    <circle cx="285" cy="342" r="13" fill="#dc2626" stroke="#111827" stroke-width="2"/>
    <text x="306" y="347" font-size="13" fill="#e5e7eb">2 VCC</text>
  </g>

  <!-- ============ BREAKOUT ============ -->
  <g>
    <text x="470" y="120" font-size="17" font-weight="600" fill="#111827">Breakout Module, 2x6 GPIO header</text>
    <text x="470" y="142" font-size="13" fill="#6b7280">Held so the silkscreen labels read upright</text>

    <rect x="470" y="196" width="470" height="150" rx="10" fill="#1f2937"/>

    <!-- top row -->
    <text x="470" y="188" font-size="12" fill="#6b7280">top row</text>
    <circle cx="510" cy="240" r="13" fill="#374151" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="510" y="215" font-size="12" fill="#9ca3af" text-anchor="middle">5V</text>
    <circle cx="580" cy="240" r="13" fill="#374151" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="580" y="215" font-size="12" fill="#9ca3af" text-anchor="middle">TX</text>
    <circle cx="650" cy="240" r="13" fill="#374151" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="650" y="215" font-size="12" fill="#9ca3af" text-anchor="middle">RX</text>
    <circle cx="720" cy="240" r="13" fill="#16a34a" stroke="#f9fafb" stroke-width="2"/>
    <text x="720" y="215" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">IO3</text>
    <circle cx="790" cy="240" r="13" fill="#9ca3af" stroke="#f9fafb" stroke-width="2"/>
    <text x="790" y="215" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">IO6</text>
    <circle cx="860" cy="240" r="13" fill="#2563eb" stroke="#f9fafb" stroke-width="2"/>
    <text x="860" y="215" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">IO14</text>

    <!-- bottom row -->
    <circle cx="510" cy="300" r="13" fill="#dc2626" stroke="#f9fafb" stroke-width="2"/>
    <text x="510" y="332" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">3.3V</text>
    <circle cx="580" cy="300" r="13" fill="#374151" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="580" y="332" font-size="12" fill="#9ca3af" text-anchor="middle">SCL</text>
    <circle cx="650" cy="300" r="13" fill="#374151" stroke="#6b7280" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="650" y="332" font-size="12" fill="#9ca3af" text-anchor="middle">SDA</text>
    <circle cx="720" cy="300" r="13" fill="#f97316" stroke="#f9fafb" stroke-width="2"/>
    <text x="720" y="332" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">IO2</text>
    <circle cx="790" cy="300" r="13" fill="#f9fafb" stroke="#111827" stroke-width="2"/>
    <text x="790" y="332" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">IO7</text>
    <circle cx="860" cy="300" r="13" fill="#111827" stroke="#f9fafb" stroke-width="2"/>
    <text x="860" y="332" font-size="12" font-weight="600" fill="#e5e7eb" text-anchor="middle">GND</text>

    <text x="470" y="382" font-size="12" fill="#6b7280">Dashed pins stay empty</text>
  </g>

  <!-- ============ MAPPING LIST ============ -->
  <g>
    <line x1="40" y1="404" x2="940" y2="404" stroke="#e5e7eb" stroke-width="2"/>
    <text x="40" y="434" font-size="17" font-weight="600" fill="#111827">The seven wires</text>

    <g font-size="14" fill="#111827">
      <circle cx="52" cy="466" r="10" fill="#111827" stroke="#6b7280" stroke-width="1.5"/>
      <text x="74" y="471">GND　→　GND</text>

      <circle cx="52" cy="498" r="10" fill="#dc2626"/>
      <text x="74" y="503">VCC　→　3.3V</text>

      <circle cx="52" cy="530" r="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
      <text x="74" y="535">GDO0　→　IO7</text>

      <circle cx="332" cy="466" r="10" fill="#f97316"/>
      <text x="354" y="471">CSN　→　IO2</text>

      <circle cx="332" cy="498" r="10" fill="#16a34a"/>
      <text x="354" y="503">SCK　→　IO3</text>

      <circle cx="332" cy="530" r="10" fill="#9ca3af"/>
      <text x="354" y="535">MOSI　→　IO6</text>

      <circle cx="612" cy="466" r="10" fill="#2563eb"/>
      <text x="634" y="471">MISO　→　IO14</text>

      <circle cx="612" cy="498" r="10" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="634" y="503" fill="#6b7280">pin 8　→　nothing</text>
    </g>

    <rect x="40" y="556" width="900" height="42" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="60" y="582" font-size="14" fill="#991b1b">Use 3.3V, never 5V. The CC1101 is not 5V tolerant, and 5V sits one pin away on this header.</text>
  </g>
</svg>
