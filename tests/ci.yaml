# Self-contained CI build: example wiring, dummy credentials, local component.
esphome:
  name: pixmob-ci

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:
api:
ota:
  platform: esphome

wifi:
  ssid: "ci-ssid"
  password: "ci-password"

web_server:
  port: 80
  version: 3

spi:
  clk_pin: GPIO3
  miso_pin: GPIO14
  mosi_pin: GPIO6

cc1101:
  id: radio
  cs_pin: GPIO2
  frequency: 915.33MHz
  modulation_type: ASK/OOK
  output_power: 10
  packet_mode: false

remote_transmitter:
  id: tx
  pin: GPIO7
  carrier_duty_percent: 100%
  rmt_symbols: 96
  non_blocking: true

light:
  - platform: pixmob
    id: band_light
    name: "PixMob Band"
    transmitter_id: tx
    cc1101_id: radio
    group: 0
    gamma_correct: 1.0
    default_transition_length: 0s
    effects:
      - random:
      - pulse:
      - strobe:
      - flicker:
      - lambda:
          name: "Rainbow"
          update_interval: 100ms
          lambda: |-
            static uint16_t hue = 0;
            hue = (hue + 4) % 360;
            int seg = hue / 60;
            float f = (hue % 60) / 60.0f;
            float r = 0, g = 0, b = 0;
            switch (seg) {
              case 0: r = 1; g = f; break;
              case 1: r = 1 - f; g = 1; break;
              case 2: g = 1; b = f; break;
              case 3: g = 1 - f; b = 1; break;
              case 4: b = 1; r = f; break;
              default: b = 1 - f; r = 1; break;
            }
            auto call = id(band_light).turn_on();
            call.set_publish(false);
            call.set_save(false);
            call.set_transition_length(0);
            call.set_rgb(r, g, b);
            call.perform();
