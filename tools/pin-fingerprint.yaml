# Identify which wire is on which CC1101 pin, without a multimeter.
#
# Use this when the boot log reports a chip ID other than 0x0014 and you
# suspect the wiring, which is easy to get wrong on modules whose header
# has no pin labels.
#
# It does not use SPI or the cc1101 component at all. It samples the four
# data wires while toggling the pin you believe is chip select, and prints
# three rapid samples per wire per line.
#
# Reading the output:
#   111 steady high  -> an input pin (SCK, MOSI) or a disconnected wire
#   000 steady low   -> held low
#   mixed, e.g. 101  -> a fast-toggling output. This is GDO0: a
#                       freshly-reset CC1101 idles it as a ~13.5MHz clock
#                       (XOSC/192). It is the anchor that tells you the
#                       header's orientation.
#   MISO answers CS  -> with a correct CS wire, MISO reads low while CS is
#                       driven low and floats high when CS is released
#
# Set the five pin numbers below to whatever you actually wired, flash, and
# watch the log. Pin order on the module then follows from where GDO0 landed.
#
# use_interrupt: false matters. A GPIO sensor watching GDO0's clock with
# interrupts enabled generates millions of interrupts a second and hangs
# the device in an Interrupt-WDT boot loop.

substitutions:
  cs_pin: GPIO2
  wire_a: GPIO3     # believed SCK
  wire_b: GPIO14    # believed MISO
  wire_c: GPIO6     # believed MOSI
  wire_d: GPIO7     # believed GDO0

esphome:
  name: pixmob-pin-fingerprint

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  framework:
    type: esp-idf

logger:
ota:
  platform: esphome
captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "pixmob-fingerprint"

switch:
  # Apollo Starter Kit only: holds the breakout's switched 3.3V rail on.
  # Delete this block on a plain devkit.
  - platform: gpio
    pin:
      number: GPIO4
      ignore_strapping_warning: true
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 2000
    internal: true

  - platform: gpio
    pin: ${cs_pin}
    id: cs_line
    restore_mode: ALWAYS_ON   # CS idles high, chip deselected

binary_sensor:
  - platform: gpio
    id: line_a
    use_interrupt: false
    pin:
      number: ${wire_a}
      mode:
        input: true
        pullup: true
  - platform: gpio
    id: line_b
    use_interrupt: false
    pin:
      number: ${wire_b}
      mode:
        input: true
        pullup: true
  - platform: gpio
    id: line_c
    use_interrupt: false
    pin:
      number: ${wire_c}
      mode:
        input: true
        pullup: true
  - platform: gpio
    id: line_d
    use_interrupt: false
    pin:
      number: ${wire_d}
      mode:
        input: true
        pullup: true

interval:
  - interval: 4s
    then:
      - switch.turn_off: cs_line
      - delay: 100ms
      - lambda: |-
          char a[4], b[4], c[4], d[4];
          for (int i = 0; i < 3; i++) {
            a[i] = gpio_get_level((gpio_num_t) ${wire_a}) ? '1' : '0';
            b[i] = gpio_get_level((gpio_num_t) ${wire_b}) ? '1' : '0';
            c[i] = gpio_get_level((gpio_num_t) ${wire_c}) ? '1' : '0';
            d[i] = gpio_get_level((gpio_num_t) ${wire_d}) ? '1' : '0';
          }
          a[3] = b[3] = c[3] = d[3] = 0;
          ESP_LOGI("fingerprint", "CS LOW : a=%s b=%s c=%s d=%s", a, b, c, d);
      - switch.turn_on: cs_line
      - delay: 100ms
      - lambda: |-
          char a[4], b[4], c[4], d[4];
          for (int i = 0; i < 3; i++) {
            a[i] = gpio_get_level((gpio_num_t) ${wire_a}) ? '1' : '0';
            b[i] = gpio_get_level((gpio_num_t) ${wire_b}) ? '1' : '0';
            c[i] = gpio_get_level((gpio_num_t) ${wire_c}) ? '1' : '0';
            d[i] = gpio_get_level((gpio_num_t) ${wire_d}) ? '1' : '0';
          }
          a[3] = b[3] = c[3] = d[3] = 0;
          ESP_LOGI("fingerprint", "CS HIGH: a=%s b=%s c=%s d=%s", a, b, c, d);
